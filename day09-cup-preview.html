<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Day 9 · Cup preview</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body { margin: 0; background: #173b34; overflow: hidden; }
      #cup-preview { width: 100%; height: 100svh; touch-action: none; }
      canvas { display: block; width: 100%; height: 100%; }
      #error { position: absolute; inset: 35% 24px auto; color: #fff0d6; text-align: center; font: 18px/1.5 system-ui; }
      .prototype-controls { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; color: #fff0d6; font: 13px/1.4 system-ui; pointer-events: none; }
      .prototype-controls button, .prototype-controls details { pointer-events: auto; }
      .toolbar { display: flex; gap: 8px; }
      button { min-height: 40px; padding: 8px 12px; border: 1px solid #fff0d64d; border-radius: 12px; background: #173b34ed; color: inherit; font: inherit; cursor: pointer; }
      button[aria-pressed="true"] { background: #705032; }
      button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid #f5ce84; outline-offset: 3px; }
      details { margin-top: 8px; width: min(310px, 100%); padding: 10px 12px; border-radius: 12px; background: #102b26eb; max-height: 55svh; overflow: auto; }
      summary { cursor: pointer; }
      label { display: grid; grid-template-columns: 105px 1fr; align-items: center; gap: 8px; margin: 9px 0; }
      input { width: 100%; accent-color: #e6bd78; }
      .presets { display: flex; gap: 5px; flex-wrap: wrap; }
      .presets button { font-size: 12px; padding: 7px; }
      #liquid-status { font-size: 11px; margin: 10px 0 0; }
      #sensor-status { max-width: 310px; margin: 8px 0; }
      #disturbance-cue { position: fixed; left: 50%; top: 20%; width: 7px; height: 7px; border-radius: 50%; background: #f5ce84; pointer-events: none; opacity: 0; transform: translate(var(--cue-x, 0px), var(--cue-y, 0px)); }
      #game-time { align-self: center; margin-left: 8px; }
    </style>
  </head>
  <body>
    <main id="cup-preview" aria-label="Vista previa de una taza navideña de chocolate en tres dimensiones"></main>
    <p id="error" hidden>No se pudo iniciar la vista 3D. Intenta abrirla en un navegador compatible con WebGL.</p>
    <aside class="prototype-controls" aria-label="Controles del prototipo">
      <div class="toolbar">
        <button id="reset-cup" type="button">Reiniciar</button>
        <button id="enable-sensors" type="button" aria-pressed="false">Sensores</button>
        <span id="game-time">0.0 s</span>
      </div>
      <p id="sensor-status" role="status"></p>
      <details>
        <summary>Ajustes de prueba</summary>
        <label>Fuerza <input id="disturbance-strength" type="range" min="0" max="1.5" step="0.05" value="1"></label>
        <label>Frecuencia <input id="disturbance-frequency" type="range" min="0.5" max="1.8" step="0.05" value="1"></label>
        <label>Recuperación <input id="disturbance-recovery" type="range" min="0.1" max="5" step="0.1" value="1.1"></label>
        <label>Amortiguación de la taza <input id="disturbance-damping" type="range" min="0" max="1" step="0.02" value="0.28"></label>
        <label>Velocidad angular máxima <input id="disturbance-maxAngularVelocity" type="range" min="10" max="60" step="1" value="32"></label>
        <label>Izq. / derecha <input id="tilt-roll" type="range" min="-28" max="28" step="0.1" value="0"></label>
        <label>Adelante / atrás <input id="tilt-pitch" type="range" min="-28" max="28" step="0.1" value="0"></label>
        <label>Inercia <input id="inertia" type="range" min="0.12" max="0.8" step="0.02" value="0.3"></label>
        <label>Amplitud <input id="amplitude" type="range" min="0" max="3" step="0.1" value="1"></label>
        <label>Amortiguación <input id="damping" type="range" min="0.5" max="8" step="0.1" value="2.4"></label>
        <label>Flujo continuo <input id="spill-continuous" type="checkbox"></label>
        <label>Magenta <input id="spill-magenta" type="checkbox"></label>
        <label>Caudal <input id="spill-rate" type="range" min="0.025" max="0.4" step="0.025" value="0.15"></label>
        <div class="presets">
          <button type="button" data-motion="slow">Inclinación lenta</button>
          <button type="button" data-motion="sudden">Movimiento brusco</button>
          <button type="button" data-motion="reverse">Cambios rápidos</button>
        </div>
        <p id="liquid-status"></p>
      </details>
    </aside>
    <span id="disturbance-cue" aria-hidden="true"></span>
    <script type="module" src="/src/previews/day09CupPreview.js"></script>
  </body>
</html>
