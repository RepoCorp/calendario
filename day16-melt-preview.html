<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day 16 — melting snow preview</title>
<link rel="stylesheet" href="/src/styles.css">
<style>
body{background:linear-gradient(135deg,#10281f,#17362a 48%,#5b1d24);font-family:'Source Sans 3',sans-serif}
.preview{width:min(calc(100% - 40px),440px);margin:0 auto;padding:20px 0;display:grid;gap:30px}
.date{text-align:center;margin:0;color:#ead4a3;letter-spacing:.18em;font-size:14px;font-weight:700}
.note{position:relative;min-height:200px;margin:12px 0 14px;padding:22px;display:grid;place-items:center;background:#173f59;border-radius:24px;box-shadow:0 18px 32px #0004}
.note p{margin:0;text-align:center;font-size:18px;line-height:1.5;color:#fff0d3}
.snow{position:absolute;left:-13%;top:-40%;width:126%;max-width:none;height:160%;object-fit:fill;pointer-events:none}
.note.uncovered .snow{visibility:hidden}
.snow[hidden]{display:none}
.controls{display:flex;justify-content:center;gap:8px}
.controls button{font:600 15px 'Source Sans 3',sans-serif;color:#fff0d3;background:#7a1024;border:1px solid #e8d1a44d;border-radius:24px;padding:10px 18px;cursor:pointer}
.controls button:focus-visible{outline:2px solid #f4d277;outline-offset:3px}
.controls button[aria-pressed="true"]{background:#285f7c;border-color:#d7edfa}
.scene{height:340px;border-radius:24px;overflow:hidden;background:linear-gradient(#173f59,#356b7f 62%,#c5dae3 62%,#edf5f4);text-align:center}
.scene img{height:100%;width:auto;max-width:100%;object-fit:contain}
.caption{margin:0;text-align:center;color:#e5d9c0;font-size:13px}
@media(max-width:360px){.note{min-height:180px;padding:18px}.scene{height:260px}}
</style></head>
<body><main class="preview">
<p class="date">DICIEMBRE 16</p>
<article class="note" id="note">
<p>Que nunca les falten motivos para reír. Sus risas llenan de alegría esta Navidad. Los quiero muchísimo.</p>
<img class="snow" data-stage="1" src="/images/day16-snow-translucent-intermediate.png" alt="Primera etapa de nieve semitransparente">
<img class="snow" data-stage="2" src="/images/day16-snow-translucent-alpha-edit.png" alt="Nieve con zonas oscuras convertidas en velo translúcido" hidden>
</article>
<div class="controls">
<button data-select-stage="1" type="button" aria-pressed="true">Etapa 1</button>
<button data-select-stage="2" type="button" aria-pressed="false">Etapa 2</button>
<button id="toggle" type="button" aria-pressed="false">Sin nieve</button>
</div>
<p class="caption" id="caption" aria-live="polite">Vista previa · etapa 1</p>
<div class="scene"><img src="/images/day16-realistic-snowman.png" alt="Muñeco de nieve"></div>
</main><script>
const button=document.getElementById('toggle');
let currentStage='1';
document.querySelectorAll('[data-select-stage]').forEach(control=>control.addEventListener('click',()=>{
  currentStage=control.dataset.selectStage;
  document.querySelectorAll('[data-stage]').forEach(img=>{img.hidden=img.dataset.stage!==currentStage;});
  document.querySelectorAll('[data-select-stage]').forEach(item=>item.setAttribute('aria-pressed',String(item.dataset.selectStage===currentStage)));
  document.getElementById('note').classList.remove('uncovered');
  button.setAttribute('aria-pressed','false');
  document.getElementById('caption').textContent=`Vista previa · etapa ${currentStage}`;
}));
button.addEventListener('click',()=>{const uncovered=document.getElementById('note').classList.toggle('uncovered');button.setAttribute('aria-pressed',String(uncovered));document.getElementById('caption').textContent=uncovered?'Vista previa · sin nieve':`Vista previa · etapa ${currentStage}`;});
</script></body></html>
